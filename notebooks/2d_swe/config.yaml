# Configuration file for operator network training

# Random seed
seed: 42

# GPU index
gpu_idx: 4
# Model parameters
num_bases: 4
trunk_arch: [2, 60, 60, 10]
branch_arch: [2, 40, 40, 10]

# Training parameters
num_trunk_epochs: 20000 # both trunk and branch training iteration
num_LBFGS_epochs: 1000
lr_start: 0.001
lr_transition_steps: 40000
lr_decay_rate: 0.97
lr_end: 0.000001
eps: 0.00000001

# Dataset parameters
dataset_path: "/Users/haydenoutlaw/Documents/Research/opnet/deep-operator-networks/notebooks/2d_swe/swe_dataset.npz"
test_size: 0.95

# Output parameters (left blank for multiple models)
# save_path:

# Logging parameters
log_frequency: 10000
lbfgs_log_frequency: 1000

